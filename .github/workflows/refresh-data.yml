# Nightly data refresh: re-runs the fetch scripts and commits any changes to data/.
# Needs the LASTFM_API_KEY repository secret (Settings → Secrets and variables → Actions).
# Without it, Last.fm is skipped and Deezer still updates.
name: Refresh data

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency: refresh-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-sources.mjs
      - run: node scripts/fetch-stats.mjs
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      - run: node scripts/fetch-cosigns.mjs   # ~3 min: MusicBrainz allows 1 request/second
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh data $(date -u +%F)"
          git push
