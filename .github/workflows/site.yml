# Refreshes data/ nightly and publishes the site to GitHub Pages.
#   - Nightly (schedule) or "Run workflow" button: refresh data, commit it, then deploy
#   - Push to main: deploy only
# Needs: Settings → Pages → Source: "GitHub Actions", and the LASTFM_API_KEY and TICKETMASTER_API_KEY
# repository secrets (without one, that source is skipped and everything else still updates).
name: Refresh data and deploy

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC (GitHub often starts scheduled runs late)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # commit refreshed data
  pages: write      # deploy to Pages
  id-token: write   # required by deploy-pages

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-charts.mjs    # seconds: today's Last.fm (global + US) and Apple Music (US) charts, for real-world rising later
        continue-on-error: true               # a Last.fm hiccup shouldn't stop the rest of the refresh
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      - run: node scripts/fetch-cosigns.mjs   # ~7 min: MusicBrainz allows 1 request/second
      - run: node scripts/fetch-tours.mjs     # ~3 min first run, then cached
      - run: node scripts/fetch-extended.mjs  # ~1 min: who else gets a page (top cosigners)
      - run: node scripts/fetch-sources.mjs   # photos for roster + extended
      - run: node scripts/fetch-upcoming.mjs  # Ticketmaster; skipped (keeps old file) without the key
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      - run: node scripts/fetch-profiles.mjs  # ~1 min
      - run: node scripts/fetch-stats.mjs     # after cosigns + tours: ranks cosigners by Last.fm listeners
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh data $(date -u +%F)"
          git push

  deploy:
    needs: refresh
    # Run after a successful refresh, or on its own for pushes (when refresh is skipped).
    if: always() && needs.refresh.result != 'failure' && needs.refresh.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # includes the data commit the refresh job just pushed
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # Astro 7 needs Node 22.12+
          cache: npm
      - name: Build the site
        # Astro reads data/*.json at build time and writes static pages to dist/.
        # Scripts, docs, raw data files and indexOld.html are not published.
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
